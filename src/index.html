<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<!-- Ảnh + tiêu đề khi gửi link qua Zalo, Messenger, Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kho Emoji">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://emoji.minhdat.me/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{const t=JSON.parse(localStorage.getItem("emoji-theme"));if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="{{PAGE}}">
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="28" height="28"><strong>Kho Emoji</strong></a>
    <nav class="tabs">{{TABS}}</nav>
    <label class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="{{PLACEHOLDER}}" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="actions">
      <button id="btn-write" class="icon-btn" aria-pressed="false" title="Chế độ soạn: bấm emoji để ghép thành câu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="Đổi giao diện sáng/tối">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="container toolbar">
    <nav class="nav">{{NAV}}</nav>
    <!--TONES--><div class="tones" role="group" aria-label="Màu da">
      <button data-tone="" class="on" title="Mặc định">✋</button>
      <button data-tone="🏻" title="Da sáng">✋🏻</button>
      <button data-tone="🏼" title="Da sáng vừa">✋🏼</button>
      <button data-tone="🏽" title="Da trung bình">✋🏽</button>
      <button data-tone="🏾" title="Da ngăm vừa">✋🏾</button>
      <button data-tone="🏿" title="Da ngăm">✋🏿</button>
    </div><!--/TONES-->
  </div>
</header>

<main class="container">
  <section id="recent" class="group" hidden><h2>Dùng gần đây</h2><div class="grid"></div></section>
  {{SECTIONS}}
  <p id="empty" class="empty" hidden>Không tìm thấy emoji phù hợp.</p>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>Dữ liệu chuẩn Unicode và CLDR</span>
    <a href="https://minhdat.me">minhdat.me</a>
  </div>
</footer>

<div id="write" class="write" hidden>
  <div class="container write-inner">
    <textarea id="write-text" rows="1" placeholder="Bấm emoji để chèn vào đây, gõ thêm chữ tuỳ ý…" aria-label="Khung soạn"></textarea>
    <button id="write-clear" class="btn">Xoá</button>
    <button id="write-copy" class="btn primary">Copy</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
{{SCRIPT}}
</body>
</html>
